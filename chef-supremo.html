<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chef Supremo 🍳</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a0a00;
    --surface: #2a1500;
    --panel: #3a1f00;
    --border: #5a3500;
    --accent: #ff9900;
    --accent2: #ff4444;
    --green: #44dd88;
    --text: #fff8ee;
    --muted: #a07040;
    --gold: #ffd700;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Quicksand', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 10% 50%, rgba(255,100,0,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 90% 20%, rgba(255,200,0,0.06) 0%, transparent 50%);
    pointer-events: none;
  }

  .topbar {
    background: var(--surface);
    border-bottom: 2px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
    flex-wrap: wrap;
    gap: 8px;
  }

  .game-title {
    font-family: 'Lilita One', cursive;
    font-size: 1.4rem;
    color: var(--accent);
    text-shadow: 0 2px 8px rgba(255,150,0,0.4);
  }

  .topbar-right { display: flex; align-items: center; gap: 10px; }

  .money-display {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 2px solid var(--gold);
    border-radius: 30px;
    padding: 6px 18px;
    font-family: 'Lilita One', cursive;
    font-size: 1.2rem;
    color: var(--gold);
    box-shadow: 0 0 20px rgba(255,215,0,0.2);
  }

  .level-badge {
    background: var(--accent2);
    border-radius: 20px;
    padding: 6px 14px;
    font-weight: 700;
    font-size: 13px;
  }

  .xp-wrap { display: flex; flex-direction: column; gap: 2px; min-width: 120px; }
  .xp-label { font-size: 10px; color: var(--muted); text-align: center; }
  .xp-bar-bg { height: 7px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .xp-bar { height: 100%; background: linear-gradient(90deg, #44aaff, var(--green)); border-radius: 4px; transition: width 0.5s ease; width: 0%; }

  .game-layout {
    display: grid;
    grid-template-columns: 1fr 290px;
    gap: 14px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 14px;
  }

  .kitchen {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 18px;
  }

  .section-title {
    font-family: 'Lilita One', cursive;
    font-size: 1rem;
    color: var(--accent);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ORDERS */
  .orders-area { margin-bottom: 18px; }

  .orders-list {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    min-height: 110px;
    padding: 8px;
    background: var(--panel);
    border: 2px dashed var(--border);
    border-radius: 12px;
    align-content: flex-start;
  }

  .order-card {
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 78px;
    position: relative;
    overflow: hidden;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .order-card.urgent {
    border-color: var(--accent2);
    box-shadow: 0 0 14px rgba(255,68,68,0.5);
  }

  .order-card.done-anim {
    border-color: var(--green) !important;
    box-shadow: 0 0 24px rgba(68,221,136,0.7) !important;
    animation: doneFlash 0.55s ease forwards;
  }

  @keyframes doneFlash {
    0%   { opacity:1; transform:scale(1); }
    40%  { opacity:1; transform:scale(1.12); background:rgba(68,221,136,0.25); }
    100% { opacity:0; transform:scale(0.7); }
  }

  .order-customer { font-size: 20px; line-height: 1; }
  .order-emoji    { font-size: 24px; line-height: 1; }
  .order-name     { font-size: 9px; font-weight: 700; text-align: center; }
  .order-price    { font-size: 11px; color: var(--gold); font-weight: 700; }
  .order-time-txt { font-size: 9px; color: var(--muted); }

  .order-timer-bar { position:absolute; bottom:0; left:0; right:0; height:4px; background:var(--border); }
  .order-timer-fill { height:100%; transition: width 1s linear, background-color 0.3s; }

  .no-orders { color:var(--muted); font-size:12px; text-align:center; width:100%; padding:24px; font-style:italic; }

  /* LEVEL TABS */
  .level-tabs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:10px; }

  .level-tab {
    padding: 3px 9px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'Quicksand', sans-serif;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }

  .level-tab.active  { background:var(--accent); border-color:var(--accent); color:#1a0a00; }
  .level-tab.locked  { opacity:0.3; cursor:not-allowed; }
  .level-tab:not(.locked):not(.active):hover { border-color:var(--accent); color:var(--accent); }

  /* DISHES */
  .dishes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
    gap: 8px;
  }

  .dish-btn {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 10px 6px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
    color: var(--text);
    font-family: 'Quicksand', sans-serif;
  }

  .dish-btn:hover:not(:disabled)  { border-color:var(--accent); transform:translateY(-3px); box-shadow:0 8px 20px rgba(255,150,0,0.25); }
  .dish-btn:active:not(:disabled) { transform:scale(0.96); }
  .dish-btn:disabled               { opacity:0.4; cursor:not-allowed; }
  .dish-btn.cooking                { border-color:var(--accent); background:#3a2500; }
  .dish-btn.has-order              { border-color:var(--green) !important; box-shadow:0 0 10px rgba(68,221,136,0.35); }

  .dish-order-dot { position:absolute; top:5px; right:5px; width:8px; height:8px; background:var(--green); border-radius:50%; display:none; }
  .dish-btn.has-order .dish-order-dot { display:block; animation: blink 1s ease infinite; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .dish-emoji    { font-size:30px; display:block; margin-bottom:5px; }
  .dish-name     { font-size:10px; font-weight:700; display:block; margin-bottom:2px; line-height:1.2; }
  .dish-price    { font-size:11px; color:var(--gold); font-weight:700; display:block; margin-bottom:2px; }
  .dish-time-txt { font-size:9px; color:var(--muted); display:block; }

  .cook-progress { position:absolute; bottom:0; left:0; right:0; height:4px; background:var(--border); }
  .cook-bar      { height:100%; background:linear-gradient(90deg, var(--accent), var(--gold)); width:0%; }

  /* SIDEBAR */
  .sidebar { display:flex; flex-direction:column; gap:12px; }

  .panel { background:var(--surface); border:2px solid var(--border); border-radius:14px; padding:14px; }

  .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }

  .stat-box { background:var(--panel); border-radius:10px; padding:8px; text-align:center; }
  .stat-val  { font-family:'Lilita One',cursive; font-size:1.2rem; color:var(--accent); display:block; }
  .stat-label{ font-size:9px; color:var(--muted); }

  .upgrade-list { display:flex; flex-direction:column; gap:6px; }

  .upgrade-btn {
    background:var(--panel); border:2px solid var(--border); border-radius:10px;
    padding:8px 10px; cursor:pointer; text-align:left; display:flex; align-items:center;
    gap:8px; transition:all 0.15s; color:var(--text); font-family:'Quicksand',sans-serif; width:100%;
  }

  .upgrade-btn:hover:not(:disabled) { border-color:var(--green); }
  .upgrade-btn:disabled { opacity:0.4; cursor:not-allowed; }
  .upgrade-btn.bought   { border-color:var(--green); background:rgba(68,221,136,0.08); }
  .upgrade-icon  { font-size:18px; flex-shrink:0; }
  .upgrade-info  { flex:1; min-width:0; }
  .upgrade-name  { font-size:11px; font-weight:700; display:block; }
  .upgrade-desc  { font-size:9px; color:var(--muted); display:block; }
  .upgrade-cost  { font-size:10px; color:var(--gold); font-weight:700; white-space:nowrap; }

  .log { font-size:10px; max-height:90px; overflow-y:auto; display:flex; flex-direction:column; gap:3px; }
  .log-entry      { padding:3px 7px; border-radius:5px; background:var(--panel); animation:fadeIn 0.3s; }
  .log-entry.earn { color:var(--gold); }
  .log-entry.fail { color:var(--accent2); }

  .float-money {
    position:fixed; font-family:'Lilita One',cursive; font-size:1.1rem; color:var(--gold);
    pointer-events:none; z-index:999; text-shadow:0 2px 8px rgba(0,0,0,0.9);
    animation:floatUp 1.3s ease forwards;
  }

  @keyframes floatUp { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-75px) scale(1.2)} }

  .levelup-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65);
    z-index:200; align-items:center; justify-content:center; backdrop-filter:blur(5px);
  }
  .levelup-overlay.show { display:flex; }

  .levelup-box {
    background:linear-gradient(135deg, #ff6600, #ffcc00); color:#1a0a00;
    font-family:'Lilita One',cursive; padding:28px 48px; border-radius:20px;
    text-align:center; box-shadow:0 0 70px rgba(255,150,0,0.9);
    animation:popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    max-width: 90vw;
  }

  .levelup-box h2 { font-size:2.2rem; margin-bottom:6px; }
  .levelup-box p  { font-size:.95rem; margin-bottom:16px; max-width:300px; }
  .levelup-box button {
    background:#1a0a00; color:var(--gold); border:none; padding:10px 24px;
    border-radius:10px; font-family:'Lilita One',cursive; font-size:1rem; cursor:pointer;
  }

  @keyframes popIn { 0%{transform:scale(0.4);opacity:0} 100%{transform:scale(1);opacity:1} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  @media (max-width:700px) {
    .game-layout { grid-template-columns:1fr; }
    .dishes-grid { grid-template-columns:repeat(3,1fr); }
    .xp-wrap { display:none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="game-title">🍳 Chef Supremo</div>
  <div class="topbar-right">
    <div class="xp-wrap">
      <div class="xp-label" id="xpLabel">XP: 0 / 80</div>
      <div class="xp-bar-bg"><div class="xp-bar" id="xpBar"></div></div>
    </div>
    <div class="level-badge">Nív. <span id="levelDisplay">1</span></div>
    <div class="money-display">💰 R$ <span id="moneyDisplay">0,00</span></div>
  </div>
</div>

<div class="game-layout">
  <div class="kitchen">

    <!-- ORDERS -->
    <div class="orders-area">
      <div class="section-title">
        📋 Pedidos dos Clientes
        <span id="orderCount" style="font-size:11px;color:var(--muted);font-family:'Quicksand';font-weight:600">(0/4)</span>
      </div>
      <div class="orders-list" id="ordersList">
        <div class="no-orders">☕ Aguardando clientes chegarem...</div>
      </div>
    </div>

    <!-- DISHES -->
    <div class="section-title">
      🍽️ Cozinhar
      <span style="font-size:10px;color:var(--muted);font-weight:600;font-family:'Quicksand'">— 🟢 prato com pedido</span>
    </div>
    <div class="level-tabs" id="levelTabs"></div>
    <div class="dishes-grid" id="dishesGrid"></div>

  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="panel">
      <div class="section-title">📊 Estatísticas</div>
      <div class="stats-grid">
        <div class="stat-box"><span class="stat-val" id="statCooked">0</span><span class="stat-label">Pratos Feitos</span></div>
        <div class="stat-box"><span class="stat-val" id="statServed">0</span><span class="stat-label">Entregues</span></div>
        <div class="stat-box"><span class="stat-val" id="statFailed">0</span><span class="stat-label">Perdidos</span></div>
        <div class="stat-box"><span class="stat-val" id="statTotal">R$0</span><span class="stat-label">Total Ganho</span></div>
      </div>
    </div>

    <div class="panel">
      <div class="section-title">⬆️ Melhorias</div>
      <div class="upgrade-list" id="upgradeList"></div>
    </div>

    <div class="panel">
      <div class="section-title">📜 Histórico</div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<div class="levelup-overlay" id="levelupOverlay">
  <div class="levelup-box">
    <div style="font-size:3rem">🎉</div>
    <h2 id="levelupTitle">Nível 2!</h2>
    <p id="levelupDesc">Novos pratos desbloqueados!</p>
    <button onclick="closeLevelUp()">Continuar Cozinhando! 👨‍🍳</button>
  </div>
</div>

<script>
// =============================================
// 30 DISHES — LEVEL 1 TO 10 (3 per level)
// =============================================
const DISHES = [
  // LVL 1
  { id:'cafe',      emoji:'☕', name:'Café',            price:5,   time:2,  level:1 },
  { id:'suco',      emoji:'🧃', name:'Suco Natural',    price:8,   time:3,  level:1 },
  { id:'torrada',   emoji:'🍞', name:'Torrada',         price:7,   time:3,  level:1 },
  // LVL 2
  { id:'croissant', emoji:'🥐', name:'Croissant',       price:14,  time:4,  level:2 },
  { id:'sanduiche', emoji:'🥪', name:'Sanduíche',       price:18,  time:5,  level:2 },
  { id:'batata',    emoji:'🍟', name:'Batata Frita',    price:15,  time:4,  level:2 },
  // LVL 3
  { id:'burger',    emoji:'🍔', name:'Hambúrguer',      price:28,  time:7,  level:3 },
  { id:'hotdog',    emoji:'🌭', name:'Hot Dog',         price:22,  time:5,  level:3 },
  { id:'tacos',     emoji:'🌮', name:'Tacos',           price:25,  time:6,  level:3 },
  // LVL 4
  { id:'pizza',     emoji:'🍕', name:'Pizza',           price:45,  time:10, level:4 },
  { id:'calzone',   emoji:'🫓', name:'Calzone',         price:40,  time:9,  level:4 },
  { id:'massa',     emoji:'🍝', name:'Macarrão',        price:35,  time:8,  level:4 },
  // LVL 5
  { id:'ramen',     emoji:'🍜', name:'Ramen',           price:42,  time:9,  level:5 },
  { id:'sushi',     emoji:'🍣', name:'Sushi',           price:55,  time:11, level:5 },
  { id:'gyoza',     emoji:'🥟', name:'Gyoza',           price:38,  time:8,  level:5 },
  // LVL 6
  { id:'steak',     emoji:'🥩', name:'Churrasco',       price:70,  time:13, level:6 },
  { id:'frango',    emoji:'🍗', name:'Frango Grelhado', price:55,  time:11, level:6 },
  { id:'costela',   emoji:'🍖', name:'Costela',         price:80,  time:15, level:6 },
  // LVL 7
  { id:'peixe',     emoji:'🐟', name:'Peixe Frito',     price:65,  time:12, level:7 },
  { id:'camarao',   emoji:'🦐', name:'Camarão',         price:85,  time:14, level:7 },
  { id:'lagosta',   emoji:'🦞', name:'Lagosta',         price:130, time:18, level:7 },
  // LVL 8
  { id:'salada',    emoji:'🥗', name:'Salada Gourmet',  price:60,  time:8,  level:8 },
  { id:'risoto',    emoji:'🍚', name:'Risoto',          price:90,  time:15, level:8 },
  { id:'fondue',    emoji:'🫕', name:'Fondue',          price:110, time:17, level:8 },
  // LVL 9
  { id:'bolo',      emoji:'🎂', name:'Bolo de Festa',   price:75,  time:16, level:9 },
  { id:'sorvete',   emoji:'🍨', name:'Sorvete Gourmet', price:50,  time:7,  level:9 },
  { id:'crepe',     emoji:'🥞', name:'Crepe Flambado',  price:65,  time:12, level:9 },
  // LVL 10
  { id:'trufa',     emoji:'🍫', name:'Trufa de Ouro',   price:180, time:20, level:10 },
  { id:'pato',      emoji:'🦆', name:'Pato Confitado',  price:200, time:22, level:10 },
  { id:'wagyu',     emoji:'🐄', name:'Wagyu A5',        price:300, time:25, level:10 },
];

// XP needed to reach each level (index = level)
const LEVEL_XP = [0, 0, 80, 220, 500, 950, 1800, 3200, 5500, 9000, 15000];

const UPGRADES = [
  { id:'speed1',  icon:'🔥', name:'Fogão Rápido',         desc:'Cozinha 25% mais rápido',     cost:70,   effect:()=>{ speedMult*=0.75; } },
  { id:'speed2',  icon:'⚡', name:'Fogão Industrial',     desc:'Cozinha 40% mais rápido',     cost:350,  effect:()=>{ speedMult*=0.60; } },
  { id:'speed3',  icon:'🤖', name:'Cozinha Robótica',     desc:'Cozinha 50% mais rápido',     cost:1200, effect:()=>{ speedMult*=0.50; } },
  { id:'bonus1',  icon:'🌶️', name:'Tempero Especial',     desc:'+30% valor nos pratos',       cost:130,  effect:()=>{ priceMult*=1.3; } },
  { id:'bonus2',  icon:'⭐', name:'Menu Premium',         desc:'+60% valor nos pratos',       cost:550,  effect:()=>{ priceMult*=1.6; } },
  { id:'bonus3',  icon:'🏅', name:'Chef Estrela Michelin',desc:'+100% valor nos pratos',      cost:2500, effect:()=>{ priceMult*=2.0; } },
  { id:'orders1', icon:'🧑‍🍳', name:'Garçom Extra',         desc:'+2 pedidos simultâneos',      cost:200,  effect:()=>{ maxOrders+=2; } },
  { id:'orders2', icon:'👨‍👩‍👧', name:'Equipe de Sala',       desc:'+3 pedidos simultâneos',      cost:700,  effect:()=>{ maxOrders+=3; } },
  { id:'time1',   icon:'⏰', name:'Clientes Pacientes',   desc:'Pedidos duram 50% mais',      cost:110,  effect:()=>{ orderTime*=1.5; } },
  { id:'time2',   icon:'🛋️', name:'VIP Lounge',           desc:'Pedidos duram 80% mais',      cost:450,  effect:()=>{ orderTime*=1.8; } },
];

// =============================================
// STATE
// =============================================
let money = 0, totalEarned = 0, level = 1;
let cooked = 0, served = 0, failed = 0;
let speedMult = 1, priceMult = 1, maxOrders = 4, orderTime = 28;
let orders = [], cooking = {}, boughtUpgrades = new Set();
let orderIdCounter = 0, viewLevel = 1;
let audioCtx = null;

const CUSTOMERS = ['👨','👩','👴','👵','🧑','👦','👧','🧔','👨‍🦱','👩‍🦰','🧑‍🍳','👮','🕵️','🧑‍💼','🤵','👸'];

// =============================================
// AUDIO
// =============================================
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playBell() {
  try {
    const ctx = getAudioCtx();
    [1046.5, 1318.5, 1567.98].forEach((freq, i) => {
      setTimeout(() => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.28, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.9);
      }, i * 130);
    });
  } catch(e){}
}

function playLevelUpSound() {
  try {
    const ctx = getAudioCtx();
    [523, 659, 784, 1047].forEach((freq, i) => {
      setTimeout(() => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.22, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.4);
      }, i * 160);
    });
  } catch(e){}
}

function playFail() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3);
  } catch(e){}
}

// =============================================
// INIT
// =============================================
function init() {
  renderLevelTabs();
  renderDishes();
  renderUpgrades();
  startOrderGenerator();
  setInterval(tickOrders, 1000);
  setInterval(() => { renderUpgrades(); updateXp(); }, 1200);
}

// =============================================
// LEVEL TABS
// =============================================
function renderLevelTabs() {
  const tabs = document.getElementById('levelTabs');
  tabs.innerHTML = '';
  for (let l = 1; l <= 10; l++) {
    const btn = document.createElement('button');
    const locked = l > level;
    btn.className = 'level-tab' + (locked ? ' locked' : '') + (l === viewLevel ? ' active' : '');
    btn.textContent = `Nív.${l}`;
    if (!locked) btn.onclick = () => { viewLevel = l; renderLevelTabs(); renderDishes(); };
    tabs.appendChild(btn);
  }
}

// =============================================
// DISHES
// =============================================
function getPrice(dish) { return dish.price * priceMult; }

function renderDishes() {
  const grid = document.getElementById('dishesGrid');
  grid.innerHTML = '';
  const orderDishIds = new Set(orders.map(o => o.dish.id));
  DISHES.filter(d => d.level === viewLevel).forEach(dish => {
    const unlocked = dish.level <= level;
    const isCooking = !!cooking[dish.id];
    const hasOrder = orderDishIds.has(dish.id);
    const btn = document.createElement('button');
    btn.className = 'dish-btn' + (isCooking ? ' cooking' : '') + (hasOrder && !isCooking ? ' has-order' : '');
    btn.id = 'dish-' + dish.id;
    btn.disabled = !unlocked || isCooking;
    btn.innerHTML = `
      <div class="dish-order-dot"></div>
      <span class="dish-emoji">${dish.emoji}</span>
      <span class="dish-name">${dish.name}</span>
      <span class="dish-price">R$ ${getPrice(dish).toFixed(0)}</span>
      <span class="dish-time-txt">⏱ ${Math.ceil(dish.time * speedMult)}s</span>
      <div class="cook-progress"><div class="cook-bar" id="bar-${dish.id}"></div></div>
    `;
    if (unlocked && !isCooking) btn.onclick = () => cookDish(dish);
    grid.appendChild(btn);
  });
}

function cookDish(dish) {
  if (cooking[dish.id]) return;
  cooking[dish.id] = true;
  renderDishes();
  const duration = dish.time * speedMult * 1000;
  const start = Date.now();
  const iv = setInterval(() => {
    const pct = Math.min(((Date.now() - start) / duration) * 100, 100);
    const bar = document.getElementById('bar-' + dish.id);
    if (bar) bar.style.width = pct + '%';
    if (Date.now() - start >= duration) { clearInterval(iv); finishCooking(dish); }
  }, 60);
}

function finishCooking(dish) {
  delete cooking[dish.id];
  cooked++;
  document.getElementById('statCooked').textContent = cooked;

  const matchIdx = orders.findIndex(o => o.dish.id === dish.id);
  if (matchIdx !== -1) {
    const order = orders[matchIdx];
    const cardEl = document.getElementById('order-' + order.id);
    if (cardEl) {
      cardEl.classList.add('done-anim');
      setTimeout(() => { orders.splice(matchIdx, 1); renderOrders(); renderDishes(); }, 560);
    } else {
      orders.splice(matchIdx, 1); renderOrders(); renderDishes();
    }
    const earned = getPrice(dish);
    earnMoney(earned);
    served++;
    playBell();
    document.getElementById('statServed').textContent = served;
    addLog(`✅ ${dish.emoji} ${dish.name} entregue! +R$ ${earned.toFixed(0)}`, 'earn');
    showFloatMoney('+R$' + earned.toFixed(0));
  } else {
    const half = getPrice(dish) * 0.5;
    earnMoney(half);
    addLog(`🍽️ ${dish.emoji} sem pedido — +R$ ${half.toFixed(0)}`, 'earn');
    showFloatMoney('+R$' + half.toFixed(0));
    renderDishes();
  }
  checkLevel();
}

// =============================================
// ORDERS — pedidos ficam fixos até serem atendidos ou expirarem
// =============================================
function startOrderGenerator() {
  function spawn() {
    if (orders.length < maxOrders) {
      const avail = DISHES.filter(d => d.level <= level);
      const dish = avail[Math.floor(Math.random() * avail.length)];
      const customer = CUSTOMERS[Math.floor(Math.random() * CUSTOMERS.length)];
      orders.push({ id: orderIdCounter++, dish, customer, timeLeft: Math.round(orderTime), maxTime: Math.round(orderTime), urgent: false });
      renderOrders();
      renderDishes();
    }
    setTimeout(spawn, 3200 + Math.random() * 3500);
  }
  setTimeout(spawn, 1200);
}

function tickOrders() {
  let anyExpired = false;
  orders.forEach(o => {
    o.timeLeft = Math.max(0, o.timeLeft - 1);
    if (o.timeLeft <= o.maxTime * 0.35) o.urgent = true;
    if (o.timeLeft === 0) {
      failed++;
      document.getElementById('statFailed').textContent = failed;
      addLog(`❌ ${o.customer} foi embora! Perdeu pedido de ${o.dish.emoji}`, 'fail');
      playFail();
      anyExpired = true;
    }
  });
  if (anyExpired) {
    orders = orders.filter(o => o.timeLeft > 0);
    renderDishes();
  }
  renderOrders();
}

function renderOrders() {
  const list = document.getElementById('ordersList');
  document.getElementById('orderCount').textContent = `(${orders.length}/${maxOrders})`;

  if (orders.length === 0) {
    list.innerHTML = '<div class="no-orders">☕ Nenhum pedido por enquanto...</div>';
    return;
  }

  // Remove cards for gone orders
  [...list.querySelectorAll('.order-card')].forEach(card => {
    const id = parseInt(card.id.replace('order-', ''));
    if (!orders.find(o => o.id === id) && !card.classList.contains('done-anim')) card.remove();
  });

  // Remove no-orders msg if present
  const noMsg = list.querySelector('.no-orders');
  if (noMsg) noMsg.remove();

  // Add or update each order card
  orders.forEach(o => {
    const pct = (o.timeLeft / o.maxTime) * 100;
    const col = pct > 50 ? '#44dd88' : pct > 25 ? '#ffaa00' : '#ff4444';
    let card = document.getElementById('order-' + o.id);
    if (!card) {
      // CREATE — card stays until delivered or expired
      card = document.createElement('div');
      card.id = 'order-' + o.id;
      card.className = 'order-card' + (o.urgent ? ' urgent' : '');
      card.innerHTML = `
        <div class="order-customer">${o.customer}</div>
        <div class="order-emoji">${o.dish.emoji}</div>
        <div class="order-name">${o.dish.name}</div>
        <div class="order-price">R$ ${getPrice(o.dish).toFixed(0)}</div>
        <div class="order-time-txt" id="otime-${o.id}">${o.timeLeft}s</div>
        <div class="order-timer-bar">
          <div class="order-timer-fill" id="ofill-${o.id}" style="width:${pct}%;background:${col}"></div>
        </div>
      `;
      list.appendChild(card);
    } else {
      // UPDATE timer only — card does NOT move or rebuild
      card.className = 'order-card' + (o.urgent ? ' urgent' : '') + (card.classList.contains('done-anim') ? ' done-anim' : '');
      const t = document.getElementById('otime-' + o.id);
      const f = document.getElementById('ofill-' + o.id);
      if (t) t.textContent = o.timeLeft + 's';
      if (f) { f.style.width = pct + '%'; f.style.backgroundColor = col; }
    }
  });
}

// =============================================
// MONEY & XP
// =============================================
function earnMoney(amount) {
  money += amount; totalEarned += amount;
  document.getElementById('statTotal').textContent = 'R$' + Math.floor(totalEarned);
  updateMoneyDisplay();
}

function updateMoneyDisplay() {
  document.getElementById('moneyDisplay').textContent = money.toFixed(2).replace('.', ',');
}

function showFloatMoney(text) {
  const el = document.createElement('div');
  el.className = 'float-money';
  el.textContent = text;
  el.style.left = (Math.random() * 50 + 25) + '%';
  el.style.top = '60px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1400);
}

function updateXp() {
  if (level >= 10) { document.getElementById('xpBar').style.width = '100%'; document.getElementById('xpLabel').textContent = 'Nível Máximo! 🏆'; return; }
  const cur = LEVEL_XP[level], next = LEVEL_XP[level + 1];
  const pct = Math.min(((totalEarned - cur) / (next - cur)) * 100, 100);
  document.getElementById('xpBar').style.width = pct + '%';
  document.getElementById('xpLabel').textContent = `XP: ${Math.floor(totalEarned - cur)} / ${next - cur}`;
}

// =============================================
// UPGRADES
// =============================================
function renderUpgrades() {
  const list = document.getElementById('upgradeList');
  list.innerHTML = '';
  UPGRADES.forEach(upg => {
    const bought = boughtUpgrades.has(upg.id);
    const btn = document.createElement('button');
    btn.className = 'upgrade-btn' + (bought ? ' bought' : '');
    btn.disabled = bought || money < upg.cost;
    btn.innerHTML = `
      <span class="upgrade-icon">${upg.icon}</span>
      <div class="upgrade-info">
        <span class="upgrade-name">${upg.name}</span>
        <span class="upgrade-desc">${upg.desc}</span>
      </div>
      <span class="upgrade-cost">${bought ? '✓' : 'R$' + upg.cost}</span>
    `;
    if (!bought) btn.onclick = () => buyUpgrade(upg);
    list.appendChild(btn);
  });
}

function buyUpgrade(upg) {
  if (money < upg.cost || boughtUpgrades.has(upg.id)) return;
  money -= upg.cost;
  boughtUpgrades.add(upg.id);
  upg.effect();
  updateMoneyDisplay();
  addLog(`⬆️ Comprou: ${upg.name}`, 'earn');
  renderUpgrades();
  renderDishes();
}

// =============================================
// LEVEL
// =============================================
function checkLevel() {
  if (level >= 10) return;
  const newLevel = LEVEL_XP.filter((xp, i) => i > 0 && totalEarned >= xp).length;
  if (newLevel > level) {
    level = newLevel;
    document.getElementById('levelDisplay').textContent = level;
    playLevelUpSound();
    renderLevelTabs();
    renderDishes();
    updateXp();
    addLog(`🎉 Nível ${level}! Novos pratos desbloqueados!`, 'earn');
    const newDishes = DISHES.filter(d => d.level === level).map(d => d.emoji + ' ' + d.name).join(', ');
    document.getElementById('levelupTitle').textContent = `🎉 Nível ${level}!`;
    document.getElementById('levelupDesc').textContent = newDishes ? `Novos: ${newDishes}` : 'Você é incrível!';
    document.getElementById('levelupOverlay').classList.add('show');
  }
}

function closeLevelUp() { document.getElementById('levelupOverlay').classList.remove('show'); }

// =============================================
// LOG
// =============================================
function addLog(text, type) {
  const log = document.getElementById('log');
  const entry = document.createElement('div');
  entry.className = 'log-entry ' + (type || '');
  entry.textContent = text;
  log.insertBefore(entry, log.firstChild);
  if (log.children.length > 30) log.removeChild(log.lastChild);
}

// Unlock audio on first click
document.addEventListener('click', () => { try { getAudioCtx().resume(); } catch(e){} }, { once: true });

init();
</script>
